# H2 Database configuration for development
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/ecommerce_detail_ai;AUTO_SERVER=TRUE;MODE=MySQL
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# MyBatis Plus configuration for H2
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ecommerce.detail.ai.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.ecommerce.detail.ai: DEBUG
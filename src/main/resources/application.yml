server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ecommerce-detail-ai
  
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ecommerce_detail_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ecommerce.detail.ai.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# AI relay配置 - 默认关闭，启用后调用 OpenAI-compatible /v1/chat/completions
ai:
  relay:
    enabled: ${AI_RELAY_ENABLED:false}
    base-url: ${AI_RELAY_BASE_URL:}
    api-key: ${AI_RELAY_API_KEY:}
    model: ${AI_RELAY_MODEL:}
    temperature: ${AI_RELAY_TEMPERATURE:0.7}
    max-tokens: ${AI_RELAY_MAX_TOKENS:4000}
    timeout-seconds: ${AI_RELAY_TIMEOUT_SECONDS:120}
  
  # 品牌模板配置
  brand-templates:
    enabled: true
    template-dir: classpath:/templates/brands/

# 业务配置
tools:
  adapters:
    crawl4ai:
      enabled: ${TOOL_CRAWL4AI_ENABLED:false}
      base-url: ${TOOL_CRAWL4AI_BASE_URL:}
      api-key: ${TOOL_CRAWL4AI_API_KEY:}
      timeout-seconds: ${TOOL_CRAWL4AI_TIMEOUT_SECONDS:120}
    browser-use:
      enabled: ${TOOL_BROWSER_USE_ENABLED:false}
      base-url: ${TOOL_BROWSER_USE_BASE_URL:}
      api-key: ${TOOL_BROWSER_USE_API_KEY:}
      timeout-seconds: ${TOOL_BROWSER_USE_TIMEOUT_SECONDS:120}
    scrapy:
      enabled: ${TOOL_SCRAPY_ENABLED:false}
      base-url: ${TOOL_SCRAPY_BASE_URL:}
      api-key: ${TOOL_SCRAPY_API_KEY:}
      timeout-seconds: ${TOOL_SCRAPY_TIMEOUT_SECONDS:120}
    promptflow:
      enabled: ${TOOL_PROMPTFLOW_ENABLED:false}
      base-url: ${TOOL_PROMPTFLOW_BASE_URL:}
      api-key: ${TOOL_PROMPTFLOW_API_KEY:}
      timeout-seconds: ${TOOL_PROMPTFLOW_TIMEOUT_SECONDS:120}
    langfuse:
      enabled: ${TOOL_LANGFUSE_ENABLED:false}
      base-url: ${TOOL_LANGFUSE_BASE_URL:}
      api-key: ${TOOL_LANGFUSE_API_KEY:}
      timeout-seconds: ${TOOL_LANGFUSE_TIMEOUT_SECONDS:120}
    llava:
      enabled: ${TOOL_LLAVA_ENABLED:false}
      base-url: ${TOOL_LLAVA_BASE_URL:}
      api-key: ${TOOL_LLAVA_API_KEY:}
      timeout-seconds: ${TOOL_LLAVA_TIMEOUT_SECONDS:120}
    comfyui:
      enabled: ${TOOL_COMFYUI_ENABLED:false}
      base-url: ${TOOL_COMFYUI_BASE_URL:}
      api-key: ${TOOL_COMFYUI_API_KEY:}
      timeout-seconds: ${TOOL_COMFYUI_TIMEOUT_SECONDS:300}
    controlnet:
      enabled: ${TOOL_CONTROLNET_ENABLED:false}
      base-url: ${TOOL_CONTROLNET_BASE_URL:}
      api-key: ${TOOL_CONTROLNET_API_KEY:}
      timeout-seconds: ${TOOL_CONTROLNET_TIMEOUT_SECONDS:300}
    grounded-sam:
      enabled: ${TOOL_GROUNDED_SAM_ENABLED:false}
      base-url: ${TOOL_GROUNDED_SAM_BASE_URL:}
      api-key: ${TOOL_GROUNDED_SAM_API_KEY:}
      timeout-seconds: ${TOOL_GROUNDED_SAM_TIMEOUT_SECONDS:300}
    iopaint:
      enabled: ${TOOL_IOPAINT_ENABLED:false}
      base-url: ${TOOL_IOPAINT_BASE_URL:}
      api-key: ${TOOL_IOPAINT_API_KEY:}
      timeout-seconds: ${TOOL_IOPAINT_TIMEOUT_SECONDS:300}
    real-esrgan:
      enabled: ${TOOL_REAL_ESRGAN_ENABLED:false}
      base-url: ${TOOL_REAL_ESRGAN_BASE_URL:}
      api-key: ${TOOL_REAL_ESRGAN_API_KEY:}
      timeout-seconds: ${TOOL_REAL_ESRGAN_TIMEOUT_SECONDS:300}
    imagemagick:
      enabled: ${TOOL_IMAGEMAGICK_ENABLED:false}
      base-url: ${TOOL_IMAGEMAGICK_BASE_URL:}
      api-key: ${TOOL_IMAGEMAGICK_API_KEY:}
      timeout-seconds: ${TOOL_IMAGEMAGICK_TIMEOUT_SECONDS:300}
    playwright:
      enabled: ${TOOL_PLAYWRIGHT_ENABLED:false}
      base-url: ${TOOL_PLAYWRIGHT_BASE_URL:}
      api-key: ${TOOL_PLAYWRIGHT_API_KEY:}
      timeout-seconds: ${TOOL_PLAYWRIGHT_TIMEOUT_SECONDS:180}

business:
  # 审核流程配置
  approval:
    auto-check-enabled: true
    risk-levels:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
  
  # 导出配置
  export:
    supported-formats:
      - WORD
      - MARKDOWN
      - JSON
      - HTML
  
  # 缓存配置
  cache:
    ttl: 3600
    max-size: 1000

# 日志配置
logging:
  level:
    root: INFO
    com.ecommerce.detail.ai: DEBUG
    com.ecommerce.detail.ai.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ecommerce-detail-ai.log
    max-size: 10MB
    max-history: 30
